name: Device Tests

# dotnet-build.yml calls this workflow, so the device tests are part of the Build run and its jobs can wait for them.
on:
    push:
        branches: [ 'os3380-t-*' ]
permissions:
    contents: read

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    TEST_FILTER: 'Category=TouchBehavior'
    # Release, the configuration that apps ship in (eng/devices/README.md, "CI"). Both steps of a job pass it: the test step looks for the
    # app that the build step made for that configuration.
    DEVICE_TEST_CONFIGURATION: Release
    # Like the sample, the device test app builds with the latest .NET MAUI release, so it and the libraries it references share one
    # version (two in one Windows app fail PRI277); the libraries keep their pinned MauiPackageVersion (.github/copilot-instructions.md).
    DEVICE_TEST_BUILD_ARGS: '/p:MauiPackageVersion=*'

# No concurrency group: called from dotnet-build.yml, the Build run's group cancels this workflow with the rest of the run (a group of
# its own would be the caller's, since github.workflow is the caller's name there, and deadlock with it); a manual run cancels nothing.

# The iOS and Android apps are built once, without coverage, for the older iOS versions and the other Android API levels
# (device_tests_ios_app, device_tests_ios_runtime, device_tests_android_app, device_tests_android_runtime); the iOS 27.2 and Android API 36 jobs
# build their own, instrumented ones.
# Every job builds and tests with eng/devices/run.ps1, the command that runs the device tests on a developer's machine too
# (eng/devices/LOCAL.md), so this file shows how to run them. -Platform is explicit because without it run.ps1 runs every platform of the
# machine and, for a Category= filter, skips a platform that has no test of the category instead of failing with 94.
jobs:
    device_tests_android_app:
        name: Device Tests (Android app for the other API levels)
        permissions:
            contents: read
        # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19 (actions/runner-images #14748).
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            DEVICE_TEST_COVERAGE: false
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Install .NET SDK v${{ env.TOOLKIT_NET_VERSION }}
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    dotnet-version: ${{ env.TOOLKIT_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
                with:
                    distribution: 'microsoft'
                    java-version: '21'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # global.json rolls forward to the newest SDK on the runner, which can be newer than the one setup-dotnet installs (TOOLKIT_NET_VERSION),
            # and the runners install workload sets, so the key names the SDK that runs and the newest workload set of its band, and the install
            # pins that version: a new workload release starts a new cache instead of being hidden by an old one.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-android-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # Keyed on the files that decide which packages a restore needs. A changed key restores from nuget.org (about 5 s for these projects
            # on the runners), and the job saves the cache when it succeeds.
            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            # Directory.Build.targets removes the iOS and Mac Catalyst target frameworks on Linux, so restore only needs Android.
            -   name: Install .NET MAUI Android Workload
                run: dotnet workload install maui-android --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            -   name: Runner diagnostics
                run: |
                    nproc
                    free -h
                    df -h "$GITHUB_WORKSPACE" "$HOME"

            -   name: Build device test app
                run: pwsh ./eng/devices/run.ps1 -Platform android -Target buildOnly -Configuration "$DEVICE_TEST_CONFIGURATION" -BuildArgs "$DEVICE_TEST_BUILD_ARGS"

            # The packed path keeps bin/<configuration>/<target framework>/ relative to the project, as device_tests_ios_app does, so
            # run.ps1 finds the app where a build puts it. The glob follows the repo's NetVersion.
            -   name: Pack the app
                shell: bash
                run: |
                    cd src/CommunityToolkit.Maui.DeviceTests
                    shopt -s nullglob
                    apps=(bin/"$DEVICE_TEST_CONFIGURATION"/net*-android/*-Signed.apk)
                    if [ "${#apps[@]}" -ne 1 ]; then
                        echo "::error::Expected one signed Android app, found ${#apps[@]}: ${apps[*]}"
                        exit 1
                    fi
                    tar -czf "$RUNNER_TEMP/android-app.tgz" "${apps[0]}"
                    ls -l "$RUNNER_TEMP/android-app.tgz"

            -   name: Upload the app
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: android-app
                    path: ${{ runner.temp }}/android-app.tgz
                    compression-level: 0
                    # 3 days, so that re-running only a failed API level a day later still finds the app.
                    retention-days: 3
                    if-no-files-found: error

            -   name: Upload build logs
                if: failure()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-android-app-logs
                    path: artifacts/logs/

    # The app of device_tests_android_app on the newest release of every Android major version from 7.1 (API 25); device_tests_android adds API 36.
    # Other levels, such as API 24 (the app's minimum), run only on a local AVD. Quoted api-level values: the emulator action passes them to
    # sdkmanager as they are, and YAML would turn 37.0 into 37.
    # No coverage: device_tests_android collects the Android coverage.
    device_tests_android_runtime:
        name: Device Tests (Android API ${{ matrix.api-level }})
        needs: [ device_tests_android_app ]
        permissions:
            contents: read
        # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19 (actions/runner-images #14748).
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   api-level: '25'
                        ram-size: 2048M
        env:
            DEVICE_TEST_COVERAGE: false
            # OnDeviceSpeech: the emulator image gets no Play updates, so its on-device recognizer may have no language installed or never
            # answer, and then every OfflineSpeechToTextTests question waits 30 s, which can exceed the time budget.
            # Delete it when a run-everything run shows those rows passing, or skipping without the 30 s waits, on every API level.
            DEVICE_TEST_SKIP_CAPABILITIES: 'OnDeviceSpeech'
            # SecondCamera: the emulator has a back and a front camera (-camera-front emulated below), so the two-camera tests fail, instead of
            # skipping, if the emulator options ever lose one.
            DEVICE_TEST_REQUIRE_CAPABILITIES: 'SecondCamera'
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Install .NET SDK v${{ env.TOOLKIT_NET_VERSION }}
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    dotnet-version: ${{ env.TOOLKIT_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
                with:
                    distribution: 'microsoft'
                    java-version: '21'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # global.json rolls forward to the newest SDK on the runner, which can be newer than the one setup-dotnet installs (TOOLKIT_NET_VERSION),
            # and the runners install workload sets, so the key names the SDK that runs and the newest workload set of its band, and the install
            # pins that version: a new workload release starts a new cache instead of being hidden by an old one.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-android-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # No NuGet cache: this job restores no project, and a cache it saved would hold only the tools.
            # Directory.Build.targets removes the iOS and Mac Catalyst target frameworks on Linux, so restore only needs Android.
            -   name: Install .NET MAUI Android Workload
                run: dotnet workload install maui-android --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    # --settle returns once udevd has applied the rule; without it, trigger only queues the event and the check below can run first.
                    sudo udevadm trigger --name-match=kvm --settle
                    # Without a usable /dev/kvm the emulator action only warns and runs the x86_64 emulator with -accel off, far too slowly.
                    if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
                        echo '::error::/dev/kvm is not usable, so the Android emulator cannot use hardware acceleration.'
                        exit 1
                    fi

            -   name: Runner diagnostics
                run: |
                    nproc
                    free -h
                    df -h "$GITHUB_WORKSPACE" "$HOME"

            -   name: Download the app
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
                with:
                    name: android-app
                    path: ${{ runner.temp }}

            -   name: Unpack the app
                id: unpack
                run: tar -xzf "$RUNNER_TEMP/android-app.tgz" -C src/CommunityToolkit.Maui.DeviceTests

            # The runner image's cmdline-tools 12.0 write target=android-0 into the AVD of a dotted API level (actions/runner-images #14484,
            # android-emulator-runner #482 and #494), and the emulator then boots a broken guest. The action keeps the image's tools because
            # their folder exists; without it, it installs its own (20.0 has the fix).
            -   name: Remove the runner image's old cmdline-tools
                if: ${{ contains(matrix.api-level, '.') }}
                run: sudo rm -rf "$ANDROID_HOME/cmdline-tools"

            -   name: Run device tests
                if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.unpack.outcome == 'success' }}
                uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
                with:
                    api-level: ${{ matrix.api-level }}
                    target: ${{ matrix.target || 'google_apis' }}
                    arch: x86_64
                    profile: pixel_7_pro
                    cores: 4
                    ram-size: ${{ matrix.ram-size || '4096M' }}
                    disk-size: 6000M
                    force-avd-creation: false
                    # See device_tests_android for the emulator options.
                    emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated ${{ matrix.emulator-features }}
                    disable-animations: true
                    # 50 minutes, as device_tests_android. The first script line is the guard against target=android-0: a failing
                    # pre-emulator-launch-script does not stop the action, and a script line that fails skips the lines after it.
                    # The guard stays on one line because the action runs each line in its own shell.
                    # -ResultsFolder, not -Results, as device_tests_android.
                    script: |
                        avd="${ANDROID_AVD_HOME:-$HOME/.android/avd}"; grep -s '^target=' "$avd/test.ini" "$avd/test.avd/config.ini"; if [ ! -f "$avd/test.ini" ] || grep -qs '^target=android-0$' "$avd/test.ini" "$avd/test.avd/config.ini"; then echo "::error::The AVD in $avd is missing or has target=android-0 (old cmdline-tools)."; exit 1; fi
                        pwsh ./eng/devices/run.ps1 -Platform android -Target testOnly -Configuration "$DEVICE_TEST_CONFIGURATION" -DeviceId emulator-5554 -Timeout 00:50:00 -ResultsFolder artifacts/device-tests/android-api${{ matrix.api-level }}

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-android-api${{ matrix.api-level }}
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

