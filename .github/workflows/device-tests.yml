name: Device Tests

# dotnet-build.yml calls this workflow, so the device tests are part of the Build run and its jobs can wait for them.
on:
    push:
        branches: [ 'os3380-t-*' ]
permissions:
    contents: read

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    TEST_FILTER: ''
    # Release, the configuration that apps ship in (eng/devices/README.md, "CI"). Both steps of a job pass it: the test step looks for the
    # app that the build step made for that configuration.
    DEVICE_TEST_CONFIGURATION: Release
    # Like the sample, the device test app builds with the latest .NET MAUI release, so it and the libraries it references share one
    # version (two in one Windows app fail PRI277); the libraries keep their pinned MauiPackageVersion (.github/copilot-instructions.md).
    DEVICE_TEST_BUILD_ARGS: '/p:MauiPackageVersion=*'

# No concurrency group: called from dotnet-build.yml, the Build run's group cancels this workflow with the rest of the run (a group of
# its own would be the caller's, since github.workflow is the caller's name there, and deadlock with it); a manual run cancels nothing.

# The iOS and Android apps are built once, without coverage, for the older iOS versions and the other Android API levels
# (device_tests_ios_app, device_tests_ios_runtime, device_tests_android_app, device_tests_android_runtime); the iOS 27.2 and Android API 36 jobs
# build their own, instrumented ones.
# Every job builds and tests with eng/devices/run.ps1, the command that runs the device tests on a developer's machine too
# (eng/devices/LOCAL.md), so this file shows how to run them. -Platform is explicit because without it run.ps1 runs every platform of the
# machine and, for a Category= filter, skips a platform that has no test of the category instead of failing with 94.
jobs:
    device_tests_ios_app:
        name: Device Tests (iOS app for older iOS versions)
        permissions:
            contents: read
        runs-on: xcode-27
        # The Release build took 9.4 to 16.7 minutes on this runner (three runs, 2026-11-07/08).
        timeout-minutes: 60
        env:
            DEVICE_TEST_COVERAGE: false
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Set Xcode Version
                uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
                with:
                    xcode-version: ${{ env.CommunityToolkitSample_Xcode_Version }}

            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            -   name: Install .NET MAUI Workload
                run: dotnet workload install maui --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Build device test app
                run: pwsh ./eng/devices/run.ps1 -Platform ios -Target buildOnly -Configuration "$DEVICE_TEST_CONFIGURATION" -BuildArgs "$DEVICE_TEST_BUILD_ARGS"

            # A zipped artifact loses file modes (actions/upload-artifact, "Permission Loss"), and the app's executable must stay executable.
            # The glob follows the repo's NetVersion and the runner's architecture instead of naming net11.0-ios/iossimulator-arm64.
            -   name: Pack the app
                shell: bash
                run: |
                    cd src/CommunityToolkit.Maui.DeviceTests
                    shopt -s nullglob
                    apps=(bin/"$DEVICE_TEST_CONFIGURATION"/net*-ios/iossimulator-*/*.app)
                    if [ "${#apps[@]}" -ne 1 ]; then
                        echo "::error::Expected one iOS simulator app, found ${#apps[@]}: ${apps[*]}"
                        exit 1
                    fi
                    tar -czf "$RUNNER_TEMP/ios-simulator-app.tgz" "${apps[0]}"
                    ls -l "$RUNNER_TEMP/ios-simulator-app.tgz"

            -   name: Upload the app
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: ios-simulator-app
                    path: ${{ runner.temp }}/ios-simulator-app.tgz
                    compression-level: 0
                    # 3 days, so that re-running only a failed iOS version a day later still finds the app.
                    retention-days: 3
                    if-no-files-found: error

            -   name: Upload build logs
                if: failure()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-ios-app-logs
                    path: artifacts/logs/

    # The app of device_tests_ios_app on the newest release of every other supported iOS major version (device_tests_ios has 27.2), because
    # the xcode-27 image has iOS 27.x runtimes only. XHarness brings its own mlaunch, so the app that Xcode 27 built (minimum iOS 15.0)
    # runs under older Xcode versions. No coverage: device_tests_ios collects the iOS coverage.
    #   - 26.5: the macos-26 image has it (its readme, "Installed Simulators").
    #   - 18.6: the macos-15 image has it.
    #   - 17.5, 16.4, 15.5: no runner image has them, so the install step downloads the runtime. They run on macos-15 like 18.6.
    device_tests_ios_runtime:
        name: Device Tests (iOS ${{ matrix.ios-version }} Simulator)
        needs: [ device_tests_ios_app ]
        permissions:
            contents: read
        runs-on: ${{ matrix.runner }}
        # 120 minutes: the runtime download of an old iOS version took up to 12 minutes.
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   ios-version: '15.5'
                        runner: macos-15
                        xcode: '16.4'
                        install-runtime: true
        env:
            DEVICE_TEST_COVERAGE: false
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Set Xcode Version
                uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
                with:
                    xcode-version: ${{ matrix.xcode }}

            # The test step reads the app's properties with dotnet msbuild (ios.ps1), which evaluates the net*-ios target framework. An older Xcode
            # (16.4 or 26.x) is fine for that: the .NET 11 workload checks for its exact Xcode (E0191, see shared.env) only in a build, and this job
            # builds nothing.
            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # Same key as the xcode-27 jobs, which run the .NET 11 SDK that setup-dotnet installs, as this job does: it restores their cache.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # No NuGet cache: this job restores no project, and a cache it saved would hold only the tools.
            -   name: Install .NET MAUI Workload
                run: dotnet workload install maui --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            # No runner image has iOS 15, 16 or 17 (the macos-14 images were retired on 2026-11-02), and three runtimes of several GB do not fit
            # the repository's 10 GB cache, so each job downloads it. A failed download of several GB would fail the whole leg, hence the retries.
            -   name: Install the iOS ${{ matrix.ios-version }} simulator runtime
                if: ${{ matrix.install-runtime }}
                shell: bash
                env:
                    IOS_VERSION: ${{ matrix.ios-version }}
                run: |
                    runtime_is_installed() { xcrun simctl list runtimes -j | jq -e --arg v "$IOS_VERSION" '.runtimes[] | select(.platform == "iOS" and .version == $v and .isAvailable)' > /dev/null; }
                    if ! runtime_is_installed; then
                        for attempt in 1 2 3; do
                            sudo xcodes runtimes install "iOS $IOS_VERSION" && break
                            echo "::warning::Installing the iOS $IOS_VERSION runtime failed (attempt $attempt of 3)."
                            if [ "$attempt" -lt 3 ]; then sleep 30; fi
                        done
                    fi
                    if ! runtime_is_installed; then
                        echo "::error::The iOS $IOS_VERSION simulator runtime is not available."
                        exit 1
                    fi

            -   name: Runner diagnostics
                run: |
                    sw_vers
                    sysctl -n hw.ncpu hw.memsize
                    xcrun simctl list runtimes

            -   name: Download the app
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
                with:
                    name: ios-simulator-app
                    path: ${{ runner.temp }}

            -   name: Unpack the app
                id: unpack
                run: tar -xzf "$RUNNER_TEMP/ios-simulator-app.tgz" -C src/CommunityToolkit.Maui.DeviceTests

            # 60 minutes, as device_tests_ios. -Runtime picks the runtime by version; the device type is still the runtime's first iPhone with
            # one built-in screen.
            -   name: Run device tests
                if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.unpack.outcome == 'success' }}
                run: pwsh ./eng/devices/run.ps1 -Platform ios -Target testOnly -Configuration "$DEVICE_TEST_CONFIGURATION" -Runtime '${{ matrix.ios-version }}' -Timeout 01:00:00 -ResultsFolder 'artifacts/device-tests/ios-${{ matrix.ios-version }}'

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-ios-${{ matrix.ios-version }}
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

